<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-page">

        <header class="admin-header">

            <div class="brand">
                <div class="logo">F</div>

                <div>
                    <h1>Admin Panel</h1>
                    <p>Manage your portfolio messages</p>
                </div>
            </div>

            <a href="index.html" class="portfolio-link">
                ← Portfolio
            </a>

        </header>


        <main>

            <section class="welcome">

                <div>
                    <p class="small-title">DASHBOARD</p>
                    <h2>Welcome back, Admin 👋</h2>
                    <p>
                        Here's what's happening with your portfolio.
                    </p>
                </div>

            </section>


            <section class="stats">

                <div class="stat-card">
                    <div class="stat-icon">✉</div>

                    <div>
                        <h3><!-- TOTAL_MESSAGES --></h3>
                        <p>Total Messages</p>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon">●</div>

                    <div>
                        <h3><!-- UNREAD_MESSAGES --></h3>
                        <p>Unread Messages</p>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon">✓</div>

                    <div>
                        <h3><!-- READ_MESSAGES --></h3>
                        <p>Read Messages</p>
                    </div>
                </div>

            </section>


            <section class="messages">

                <div class="section-title">

                    <div>
                        <p class="small-title">INBOX</p>
                        <h2>Messages</h2>
                    </div>

                    <button class="delete-all">
                        Delete All
                    </button>

                </div>

              <!-- MESSAGE_CARDS -->
                
            </section>

        </main>


        <footer>
            FlavorAI &nbsp; • &nbsp; Admin Panel
        </footer>

    </div>

</body>
</html>
